name: Testing
on:
  push:
    branches:
      - "renovate/**"
  pull_request:
    branches-ignore:
      - "renovate/**"
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  test-app-image:
    name: Test app image
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create new buildx builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Run testing
        run: |
          cp .env.example .env
          docker compose run --rm --build testing
